# A Coolify deployment, next to the Foundry server.
#
# Set MAGI_BRIDGE_SECRET in the Coolify environment panel. It must be the
# same text as the bridge secret in the Foundry module settings.
#
# Read the security note in the Dockerfile before you turn MAGI_TRUST_LAN
# on again.

services:
  magi:
    image: ghcr.io/magdielcas/magi-live-actor-sheets:latest
    restart: unless-stopped
    environment:
      # Required. Without it the server makes a new secret at every start,
      # and the module then cannot connect after a restart.
      MAGI_BRIDGE_SECRET: ${MAGI_BRIDGE_SECRET:?set this in Coolify}

      # Every visitor must pair with a code. See the Dockerfile.
      MAGI_TRUST_LAN: "false"

      # Set this when a proxy serves the relay under a path, for example
      # https://foundry.example.com/magi. The proxy removes that path
      # before the request arrives, so the relay cannot find it again, and
      # the pairing QR picture would point at the wrong place. A service
      # with its own sub-domain does not need it.
      # MAGI_PUBLIC_URL: https://foundry.example.com/magi
    expose:
      - "30001"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:30001/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
