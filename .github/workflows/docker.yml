name: Build the container image

# This workflow checks the server and the web app, then builds the image. It
# runs on its own for a pull request, where it only proves that the build still
# works, and the release workflow calls it on a push to main, where it also
# gives the image the numbers of the version being released.

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:
    inputs:
      version:
        description: "The version being released, for example 1.2.3. Empty means no version tags."
        required: false
        type: string
        default: ""

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  check:
    name: Check the server
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum

      - name: Check the format
        working-directory: server
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        working-directory: server
        run: go vet ./...

      - name: Test
        working-directory: server
        run: go test ./...

  web:
    name: Check the web app
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version-file: app/.nvmrc
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install
        run: npm ci

      - name: Check the types
        run: npm run typecheck

      - name: Test
        run: npm test -- --run

      - name: Build
        run: npm run build

      # Three rules that no build error can catch. Each one shows up in
      # production as a page that is blank with no reason given.
      #   - an inline script or style, which the relay policy refuses;
      #   - an address that is not relative, which breaks the page under a
      #     path such as https://host/magi/;
      #   - a JS chunk that is not flat under assets/, which breaks the way
      #     the page finds its own root.
      - name: Check the build output
        run: npm run check-dist

  image:
    name: Build and push the image
    needs: [check, web]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-buildx-action@v4

      # A pull request from a fork cannot write to the registry, so the
      # image is only built there, to prove that the Dockerfile still works.
      - name: Sign in to the registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 1.2.3 also gives the image the tags 1.2 and 1, so a deployment can
      # follow a line of releases as narrowly or as loosely as it wants.
      - name: Work out the version tags
        id: version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [ -z "${VERSION:-}" ]; then
            # The tags below are turned off in this case. They still need a
            # value, because an empty one is not a tag name.
            {
              echo "released=false"
              echo "version=none"
              echo "minor=none"
              echo "major=none"
            } >> "$GITHUB_OUTPUT"
            echo "This build is not a release, so the image gets no version tags."
            exit 0
          fi
          case "$VERSION" in
            [0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "The version must look like 1.2.3, but it is '$VERSION'." >&2; exit 1 ;;
          esac
          major="${VERSION%%.*}"
          rest="${VERSION#*.}"
          minor="${rest%%.*}"
          {
            echo "released=true"
            echo "version=$VERSION"
            echo "minor=$major.$minor"
            echo "major=$major"
          } >> "$GITHUB_OUTPUT"

      - name: Choose the tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=raw,value=${{ steps.version.outputs.version }},enable=${{ steps.version.outputs.released == 'true' }}
            type=raw,value=${{ steps.version.outputs.minor }},enable=${{ steps.version.outputs.released == 'true' }}
            type=raw,value=${{ steps.version.outputs.major }},enable=${{ steps.version.outputs.released == 'true' }}
            type=raw,value=latest,enable=${{ steps.version.outputs.released == 'true' }}
            type=sha,format=short

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
